<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="loginStyle.css">
    <script src="script.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1>Hola Guapa</h1>
      <p class="login-subtitle">Posa la contrasenyna per veure la sorpresa</p>
      <form id="login-form" novalidate>
        <label for="password">Contrasenyna</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
        <p id="login-error" class="login-error" hidden>Incorrecte - Pista: Que es la Maria?</p>
        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
